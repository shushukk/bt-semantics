<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="500" fill="#1c1e21">守卫 NPC 的行为树（examples/guard.json）</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5F5E5A">每拍（tick）从根节点问一遍"现在该干什么"，每个节点返回 成功 S / 运行中 R / 失败 F</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M485 126 C485 168 205 168 205 210" fill="none" stroke="#85B7EB" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M485 126 L485 210" fill="none" stroke="#85B7EB" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M485 126 C485 168 755 168 755 210" fill="none" stroke="#85B7EB" stroke-width="1.6" marker-end="url(#a1)"/>

  <path d="M205 282 C205 322 129 322 129 360" fill="none" stroke="#5DCAA5" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M205 282 C205 322 273 322 273 360" fill="none" stroke="#5DCAA5" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M480 282 C480 322 409 322 409 360" fill="none" stroke="#5DCAA5" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M480 282 C480 322 553 322 553 360" fill="none" stroke="#5DCAA5" stroke-width="1.6" marker-end="url(#a1)"/>

  <g>
    <rect x="410" y="70" width="150" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
    <text x="485" y="92" text-anchor="middle" font-size="16" font-weight="500" fill="#0C447C">Selector 选择</text>
    <text x="485" y="112" text-anchor="middle" font-size="12" fill="#185FA5">按优先级从左往右试</text>
  </g>

  <g>
    <rect x="120" y="210" width="170" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="205" y="236" text-anchor="middle" font-size="16" font-weight="500" fill="#085041">Sequence 顺序</text>
    <text x="205" y="258" text-anchor="middle" font-size="12" fill="#0F6E56">优先级 1：逃跑</text>
  </g>
  <g>
    <rect x="395" y="210" width="170" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="480" y="236" text-anchor="middle" font-size="16" font-weight="500" fill="#085041">Sequence 顺序</text>
    <text x="480" y="258" text-anchor="middle" font-size="12" fill="#0F6E56">优先级 2：治疗</text>
  </g>
  <g>
    <rect x="670" y="210" width="170" height="72" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
    <text x="755" y="236" text-anchor="middle" font-size="16" font-weight="500" fill="#27500A">Action 动作</text>
    <text x="755" y="258" text-anchor="middle" font-size="12" fill="#3B6D11">优先级 3：巡逻 2 拍</text>
  </g>

  <g>
    <rect x="64" y="360" width="130" height="72" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
    <text x="129" y="386" text-anchor="middle" font-size="15" font-weight="500" fill="#633806">Condition</text>
    <text x="129" y="408" text-anchor="middle" font-size="12" fill="#854F0B">敌人可见？</text>
  </g>
  <g>
    <rect x="208" y="360" width="130" height="72" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
    <text x="273" y="386" text-anchor="middle" font-size="15" font-weight="500" fill="#27500A">Action</text>
    <text x="273" y="408" text-anchor="middle" font-size="12" fill="#3B6D11">逃跑（2 拍）</text>
  </g>
  <g>
    <rect x="344" y="360" width="130" height="72" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
    <text x="409" y="386" text-anchor="middle" font-size="15" font-weight="500" fill="#633806">Condition</text>
    <text x="409" y="408" text-anchor="middle" font-size="12" fill="#854F0B">血量低？</text>
  </g>
  <g>
    <rect x="488" y="360" width="130" height="72" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
    <text x="553" y="386" text-anchor="middle" font-size="15" font-weight="500" fill="#27500A">Action</text>
    <text x="553" y="408" text-anchor="middle" font-size="12" fill="#3B6D11">治疗（2 拍）</text>
  </g>

  <g>
    <rect x="180" y="470" width="110" height="34" rx="17" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
    <text x="235" y="492" text-anchor="middle" font-size="13" fill="#27500A">S 成功</text>
    <rect x="306" y="470" width="130" height="34" rx="17" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
    <text x="371" y="492" text-anchor="middle" font-size="13" fill="#0C447C">R 运行中（挂起）</text>
    <rect x="452" y="470" width="110" height="34" rx="17" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
    <text x="507" y="492" text-anchor="middle" font-size="13" fill="#791F1F">F 失败</text>
    <text x="590" y="492" font-size="13" fill="#5F5E5A">三种返回，机器只认这三种</text>
  </g>
  <text x="480" y="536" text-anchor="middle" font-size="13" fill="#5F5E5A">Selector = 优先级清单（谁成功用谁）；Sequence = 步骤清单（全做完才成功）</text>
</svg>
