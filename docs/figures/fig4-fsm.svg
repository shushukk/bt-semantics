<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="500" fill="#1c1e21">状态 = 书签快照：单个"逃跑（2 拍）"动作的完整状态机只有 2 个状态</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#5F5E5A">不变量"终止即清零"保证状态数有限 —— 这是能自动验证的前提</text>

  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M260 150 C260 92 380 92 380 146" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="320" y="86" text-anchor="middle" font-size="12" fill="#5F5E5A">空闲时再次被选中：又触发一次</text>

  <path d="M400 185 L560 185" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="480" y="128" text-anchor="middle" font-size="13" fill="#5F5E5A">第 1 拍：触发事件 flee，记忆 c 加到 1</text>
  <line x1="480" y1="136" x2="480" y2="176" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>

  <path d="M560 245 C560 310 400 310 400 245" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="480" y="330" text-anchor="middle" font-size="13" fill="#5F5E5A">第 2 拍：c 加到 2 = 时长 d，达成：成功，记忆清零（回到 s0）</text>

  <g>
    <rect x="180" y="150" width="220" height="90" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
    <text x="290" y="182" text-anchor="middle" font-size="16" font-weight="500" fill="#0C447C">s0 空闲</text>
    <text x="290" y="206" text-anchor="middle" font-size="13" fill="#185FA5">记忆 c = 0</text>
    <text x="290" y="226" text-anchor="middle" font-size="11" fill="#378ADD">初始状态</text>
  </g>
  <g>
    <rect x="560" y="150" width="220" height="90" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="670" y="182" text-anchor="middle" font-size="16" font-weight="500" fill="#085041">s1 运行中</text>
    <text x="670" y="206" text-anchor="middle" font-size="13" fill="#0F6E56">记忆 c = 1</text>
    <text x="670" y="226" text-anchor="middle" font-size="11" fill="#1D9E75">还没有清零</text>
  </g>

  <rect x="60" y="354" width="840" height="52" rx="10" fill="#F6F7F9" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="80" y="375" font-size="13" fill="#444441">整棵树的状态机 = 所有节点记忆的组合。守卫那棵树（3 个动作、各 2 拍）一共只有 4 个状态；</text>
  <text x="80" y="396" font-size="13" fill="#444441">并行分支越多、动作越长，状态数约等于各动作时长的乘积，涨得非常快 —— 这就是"状态爆炸"，也是需要云端算力的原因。</text>
</svg>
