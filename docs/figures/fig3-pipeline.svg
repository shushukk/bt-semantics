<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="500" fill="#1c1e21">项目流水线：从一棵 JSON 树到一条反例</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#5F5E5A">每一步的输出都是下一步的输入；最后一个箭头绕回解释器 —— 不盲信求解器</text>

  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="50" y="96" width="220" height="82" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
    <text x="160" y="124" text-anchor="middle" font-size="16" font-weight="500" fill="#0C447C">1. JSON 行为树</text>
    <text x="160" y="146" text-anchor="middle" font-size="12" fill="#185FA5">人写的描述（树 + 性质）</text>
    <text x="160" y="164" text-anchor="middle" font-size="11" fill="#378ADD">examples/guard.json</text>
  </g>
  <path d="M270 137 L310 137" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#a3)"/>
  <g>
    <rect x="320" y="96" width="220" height="82" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="430" y="124" text-anchor="middle" font-size="16" font-weight="500" fill="#085041">2. 解析 + 静态检查</text>
    <text x="430" y="146" text-anchor="middle" font-size="12" fill="#0F6E56">节点类型 / id 唯一 / 引用是否存在</text>
    <text x="430" y="164" text-anchor="middle" font-size="11" fill="#1D9E75">btfsv/loader.py</text>
  </g>
  <path d="M540 137 L580 137" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#a3)"/>
  <g>
    <rect x="590" y="96" width="240" height="82" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="710" y="124" text-anchor="middle" font-size="16" font-weight="500" fill="#085041">3. Tick 解释器</text>
    <text x="710" y="146" text-anchor="middle" font-size="12" fill="#0F6E56">14 条 SOS 规则的可执行版本</text>
    <text x="710" y="164" text-anchor="middle" font-size="11" fill="#1D9E75">btfsv/tree.py</text>
  </g>

  <path d="M710 178 C710 232 160 222 160 274" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#a3)"/>

  <g>
    <rect x="50" y="276" width="220" height="82" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
    <text x="160" y="304" text-anchor="middle" font-size="16" font-weight="500" fill="#633806">4. 状态空间探索</text>
    <text x="160" y="326" text-anchor="middle" font-size="12" fill="#854F0B">枚举所有"书签组合"</text>
    <text x="160" y="344" text-anchor="middle" font-size="11" fill="#BA7517">btfsv/fsm.py</text>
  </g>
  <path d="M270 317 L310 317" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#a3)"/>
  <g>
    <rect x="320" y="276" width="220" height="82" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
    <text x="430" y="304" text-anchor="middle" font-size="16" font-weight="500" fill="#3C3489">5. z3 有界验证</text>
    <text x="430" y="326" text-anchor="middle" font-size="12" fill="#534AB7">问：存在违反性质的环境吗？</text>
    <text x="430" y="344" text-anchor="middle" font-size="11" fill="#7F77DD">btfsv/z3_verify.py</text>
  </g>
  <path d="M540 317 L580 317" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#a3)"/>
  <g>
    <rect x="590" y="276" width="240" height="82" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
    <text x="710" y="304" text-anchor="middle" font-size="16" font-weight="500" fill="#791F1F">6. 反例回放复核</text>
    <text x="710" y="326" text-anchor="middle" font-size="12" fill="#A32D2D">拿环境序列回解释器真跑一遍</text>
    <text x="710" y="344" text-anchor="middle" font-size="11" fill="#E24B4A">confirmed = 语义复核通过</text>
  </g>

  <path d="M710 358 C710 400 480 400 480 384" fill="none" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <text x="600" y="414" text-anchor="middle" font-size="12" fill="#A32D2D">若不一致：说明编码有 bug，回头改第 5 步</text>

  <text x="480" y="446" text-anchor="middle" font-size="13" fill="#5F5E5A">1~3 步回答"这棵树到底什么语义"，第 4 步把它变成可分析的模型，5、6 步回答"它会不会在某些情况下出错"</text>
</svg>
